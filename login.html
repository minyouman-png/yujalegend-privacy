<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유자의 전설 — 구글 계정 연동</title>
<style>
  body { margin:0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background:#15110d; color:#f3e9d6; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#1f1812; border:3px solid #c9a860; border-radius:18px; padding:28px 26px; max-width:420px; width:90%; box-shadow:0 12px 40px rgba(0,0,0,.5); text-align:center; }
  h1 { font-size:24px; margin:0 0 6px; color:#ffe9b5; }
  p { line-height:1.5; color:#d9cbb0; font-size:15px; }
  button { margin-top:14px; width:100%; padding:14px; font-size:17px; border-radius:12px; border:2px solid #c9a860; background:#2e2318; color:#fff5e0; cursor:pointer; }
  button:disabled { opacity:.5; }
  .ok { color:#9fe3a8; font-weight:bold; font-size:18px; }
  .err { color:#ff9a8c; }
  .small { font-size:12px; color:#8f8370; margin-top:18px; }
</style>
</head>
<body>
<div class="card">
  <h1>유자의 전설</h1>
  <p id="msg">구글 계정으로 들어가면 탑 랭킹과 클라우드 저장을 쓸 수 있어요.</p>
  <button id="btn">Google 계정으로 계속</button>
  <div class="small">이 창은 게임이 열었습니다. 끝나면 게임으로 돌아가세요.</div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // 구글 OAuth 를 직접(OpenID Connect implicit, id_token) — Firebase Auth JS 의 팝업/리디렉션은 폰 브라우저(네이버 인앱·Chrome 저장소 분리)에서 결과를 잃는다.
  // 세션은 state 로 실어 보내므로 브라우저 저장소가 없어도 돌아온다. 게임은 이 id_token 으로 signInWithIdp 한다.
  const firebaseConfig = window.YUJA_FIREBASE || {
    apiKey: "AIzaSyCDqi4GhzbIaAZYfqc5nhxFRSZW9Qa2Xas",
    authDomain: "yujalegend.firebaseapp.com",
    projectId: "yujalegend",
  };
  const CLIENT_ID = "186362786177-cc1i3ume2grbfrgfq7qae13t0kn8uri1.apps.googleusercontent.com";
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const redirectUri = location.origin + location.pathname;

  function parseHash() {
    const h = new URLSearchParams(location.hash.replace(/^#/, ""));
    return { idToken: h.get("id_token") || "", state: h.get("state") || "", error: h.get("error") || "" };
  }
  function emailOf(idToken) {
    try { return JSON.parse(atob(idToken.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).email || ""; } catch (e) { return ""; }
  }
  const back = parseHash();
  const session = back.state || new URLSearchParams(location.search).get("s") || "";

  if (!session || session.length < 16) {
    msg.innerHTML = '<span class="err">세션이 없어요. 게임에서 「구글 계정 연동」을 다시 눌러 주세요.</span>';
    btn.disabled = true;
  }

  async function finish(idToken) {
    await setDoc(doc(db, "login_sessions", session), {
      id_token: idToken,
      email: emailOf(idToken),
      created: serverTimestamp(),
    });
    btn.style.display = "none";
    msg.innerHTML = '<span class="ok">연동됐어요!</span><br>이제 게임으로 돌아가세요. (이 창은 닫아도 됩니다)';
    history.replaceState(null, "", redirectUri + "?s=" + session + "&done=1");
  }

  btn.onclick = () => {
    btn.disabled = true;
    msg.textContent = "구글 로그인으로 가는 중…";
    const nonce = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, "0")).join("");
    const q = new URLSearchParams({
      client_id: CLIENT_ID, redirect_uri: redirectUri, response_type: "id_token",
      scope: "openid email profile", nonce: nonce, state: session, prompt: "select_account",
    });
    location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + q.toString();
  };

  if (back.error) {
    msg.innerHTML = '<span class="err">실패: ' + back.error + '</span>';
  } else if (back.idToken && session) {
    btn.disabled = true;
    msg.textContent = "게임에 알리는 중…";
    finish(back.idToken).catch(e => { msg.innerHTML = '<span class="err">실패: ' + (e.code || e.message) + '</span>'; });
  } else if (new URLSearchParams(location.search).get("done") === "1") {
    btn.style.display = "none";
    msg.innerHTML = '<span class="ok">연동됐어요!</span><br>이제 게임으로 돌아가세요.';
  }
</script>
</body>
</html>
